spring:
  task:
    scheduling:
      pool:
        size: 3
  application:
    name: cloudnest
  datasource:
    url: ${DATABASE_URL:jdbc:h2:file:./.data/cloudnest;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_ON_EXIT=FALSE;WRITE_DELAY=0}
    username: ${DATABASE_USER:sa}
    password: ${DATABASE_PASSWORD:}
  flyway:
    locations: classpath:db/migration/{vendor}
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 101MB
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      connect-timeout: 1s
      timeout: 1s
server:
  port: ${PORT:8080}
  forward-headers-strategy: ${FORWARD_HEADERS_STRATEGY:none}
  error:
    include-message: never
management:
  endpoints:
    web:
      exposure:
        include: health
  health:
    redis:
      enabled: ${REDIS_ENABLED:false}
cloudnest:
  ai:
    enabled: ${AI_ENABLED:false}
  registration-open: ${REGISTRATION_OPEN:true}
  data-dir: ${DATA_DIR:./.data}
  storage: ${STORAGE_BACKEND:local}
  quota: ${USER_QUOTA:5368709120}
  max-file-size: ${MAX_FILE_SIZE:2147483648}
  part-size: ${PART_SIZE:8388608}
  zip:
    max-bytes: ${ZIP_MAX_BYTES:536870912}
    max-files: ${ZIP_MAX_FILES:1000}
    max-entries: ${ZIP_MAX_ENTRIES:2000}
    hours: ${ZIP_RETENTION_HOURS:1}
    reserve-bytes: ${ZIP_RESERVE_BYTES:268435456}
    workers: ${ZIP_WORKERS:1}
    compression-level: ${ZIP_COMPRESSION_LEVEL:1}
  session-hours: 12
  upload-hours: 24
  secure-cookies: ${SECURE_COOKIES:false}
  redis-enabled: ${REDIS_ENABLED:false}
  minio:
    endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
    access-key: ${MINIO_ACCESS_KEY:}
    secret-key: ${MINIO_SECRET_KEY:}
    bucket: ${MINIO_BUCKET:cloudnest}

